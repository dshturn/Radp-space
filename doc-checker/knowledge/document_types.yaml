# Document / check types and the aliases used to recognise them in the LoR and in documents.
# supporting: true = attachments (e.g. mill certificates) that are expected inside a bundle and are not
# reported as unrecognised when they are not linked to a LoR line.
# Extend with: python -m radp_check alias add document <type> "<alias>"
types:
  mpi:
    name: Magnetic particle inspection (MPI)
    aliases: [mpi, magnetic particle inspection, magnetic particle, mpi report]
  hydrostatic_test:
    name: Hydrostatic / pressure test
    aliases: [ht, hydrostatic test, hydrotest, hydro test, pressure test, body test, pt, certificate of pressure test witness, pressure test certificate, test certificate]
  coc:
    name: Certificate of conformance (COC)
    aliases: [coc, certificate of conformance, certificate of conformity]
  load_test:
    name: Load test
    aliases: [load test, proof load test, lt]
  visual:
    name: Visual inspection
    aliases: [visual, visual inspection]
  mill_test_certificate:
    name: Mill test certificate (MTC)
    supporting: true
    aliases: [mtc, mill test certificate, mill certificate, quality certificate, inspection certificate 3.1]
  nde_report:
    name: NDE / hardness report
    supporting: true
    aliases: [nde report, hardness report, ut report]
